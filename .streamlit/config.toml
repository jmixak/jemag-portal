[theme]
# Deep Royal/Navy Blue for buttons, active tabs, and highlights
primaryColor = "#0F4C81" 

# Pure White main background
backgroundColor = "#FFFFFF" 

# Soft Metallic Silver for the sidebar, cards, and input boxes
secondaryBackgroundColor = "#E2E8F0" 

# Deep Black / Dark Slate for high-contrast, crisp text
textColor = "#0F172A" 

font = "sans serif"
